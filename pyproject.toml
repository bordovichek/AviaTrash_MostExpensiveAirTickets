[project]
name = "aviatrash"
version = "2.0.0"
description = "Шуточный сервис поиска самых дорогих авиабилетов на Django"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DJ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
