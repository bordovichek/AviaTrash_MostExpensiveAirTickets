<div class="field{% if field.errors %} field--invalid{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="field__required" aria-hidden="true">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
