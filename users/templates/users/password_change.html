{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<section class="auth">
  <div class="card auth__card">
    <a class="back-link back-link--dark" href="{% url 'users:profile' %}">
      <svg class="icon"><use href="#i-arrow-left"></use></svg> Профиль
    </a>
    <h1 class="auth__title">Смена пароля</h1>

    <form class="form" method="post">
      {% csrf_token %}
      {% include "includes/form_errors.html" %}
      {% for field in form %}{% include "includes/form_field.html" %}{% endfor %}
      <button class="btn btn--primary btn--block btn--lg" type="submit">Сменить пароль</button>
    </form>
  </div>
</section>
{% endblock %}
